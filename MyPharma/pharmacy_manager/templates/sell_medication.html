{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row">
        <div class="col-md-6">
          <h2 class="mb-4">Sell Medication</h2>
        </div>
      </div>

    <div class="card mb-4">
        <div class="card-body">
            <form method="POST" action="{% url 'sell_medication' %}">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="medication_id" class="form-label">Medication ID:</label>
                    <input type="text" class="form-control" name="medication_id" required>
                </div>
                <div class="mb-3">
                    <label for="amount_to_sell" class="form-label">Amount to Sell:</label>
                    <input type="text" class="form-control" name="amount_to_sell" required>
                </div>
                <button type="submit" class="btn btn-success" name="sell_medication">Sell Medication</button>
            </form>
        </div>
    </div>

   
    {% if messages %}
        <div class="container mt-4">
            <div class="row justify-content-center">
                <div class="col-md-8">
                    {% for message in messages %}
                    <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                    {% endfor %}
                </div>
            </div>
        </div>
    {% endif %}
</div>
{% endblock %}
