{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
  <div class="row">
    <div class="col-md-6">
      <h2>Expiring Stock View</h2>
    </div>
  </div>

  <table class="table table-striped mt-4">

    <thead>
      <tr>
        <th>Medication ID</th>
        <th>Name of Medication</th>
        <th>Expiration Date</th>
      </tr>
    </thead>

    <tbody>
      {% for medication in ordered_medications %} 
      <tr>
        <td>{{ medication.id }}</td>
        <td>{{ medication.name }}</td>
        <td>{{ medication.expiration_date }}</td>
      </tr>
      {% endfor %}
    </tbody>

  </table>
</div>
{% endblock %}
