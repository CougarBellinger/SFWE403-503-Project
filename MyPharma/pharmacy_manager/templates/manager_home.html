{% extends 'base.html' %}

{% block content %}
<h1>Welcome, {{ user.username }}</h1>
<p>This is your pharmacy manager dashboard</p>

<!-- CSV Upload Form -->
<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    <label for="csv_file">Upload CSV:</label>
    <input type="file" name="csv_file" accept=".csv" required>
    <button type="submit">Upload CSV</button>
</form>

<!-- Sell Medication Form -->
<form method="POST" action="{% url 'manager_home' %}">
    {% csrf_token %}
    <h3>Sell Medication</h3>
    <label for="medication_id">Medication ID:</label>
    <input type="text" name="medication_id" required>

    <label for="amount_to_sell">Amount to Sell:</label>
    <input type="text" name="amount_to_sell" required>

    <button type="submit" name="sell_medication">Sell Medication</button>
</form>

<!-- Display Messages -->
{% if messages %}
<ul>
    {% for message in messages %}
    <li>{{ message }}</li>
    {% endfor %}
</ul>
{% endif %}

{% endblock %}
