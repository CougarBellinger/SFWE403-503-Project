{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row">
        <div class="col-md-6">
          <h2 class="mb-4">Sign Perscriptions</h2>
        </div>
      </div>

    <div class="card mb-4">
        <div class="card-body">
            <form method="POST" action="{% url 'sign_perscriptions' %}">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="amount_to_sell" class="form-label">Signature:</label>
                    <input type="text" class="form-control" name="Signature" required>
                </div>
                <button type="submit" class="btn btn-success" name="sell_medication">Confirm</button>
            </form>
        </div>
    </div>

   
    {% if messages %}
    <div class="alert alert-info">
        <ul class="mb-0">
            {% for message in messages %}
            <li>{{ message }}</li>
            {% endfor %}
        </ul>
    </div>
    {% endif %}
</div>
{% endblock %}
