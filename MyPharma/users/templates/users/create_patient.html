{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card">
        <div class="card-header">Create patient</div>
        <div class="card-body">
          <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Submit</button>
            <a href="{% url 'patient_management' %}" class="btn btn-secondary">Back</a>
           </form>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
