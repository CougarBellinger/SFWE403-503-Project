{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
  <div class="row">
    <div class="col-md-6">
      <h2>Order Management</h2>
    </div>
  </div>

  <table class="table table-striped mt-4">
    <thead>
      <tr>
        <th>Medication ID</th>
        <th>Name of Medication</th>
        <th>Tablet Count</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      {% for medication in orderable_medications %} 
      <tr>
        <td>{{ medication.id }}</td>
        <td>{{ medication.name }}</td>
        <td>{{ medication.tablet_count }}</td>
        <td>
          <a href="{% url 'order_view' patient.pk %}" class="btn btn-warning">Order</a>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
