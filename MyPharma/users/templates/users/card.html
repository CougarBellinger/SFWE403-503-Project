{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card">
        <div class="card-header">Enter Credit/Debit Card Information</div>
        <div class="card-body">
          <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">Purchase</button>
            <a href="{% url 'payment_method' %}" class="btn btn-secondary">Back to Payment Method Selection</a>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
