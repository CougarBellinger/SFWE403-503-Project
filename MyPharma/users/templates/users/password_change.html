{% extends 'base.html' %}

{% block content %}
    <div class="container mt-5">
        <h2 class="mb-4">Profile Information</h2>

        <div class="card">
            <div class="card-body">
                <h5 class="card-title"><b>User Information</b></h5>
                <dl class="row">
                    <dt class="col-sm-3">Email:</dt>
                    <dd class="col-sm-9">{{ user.email }}</dd>

                    <dt class="col-sm-3">Is Active:</dt>
                    <dd class="col-sm-9">{{ user.is_active }}</dd>

                    <dt class="col-sm-3">Is Email Verified:</dt>
                    <dd class="col-sm-9">{{ user.is_email_verified }}</dd>
                    <!-- Add more user fields as needed -->
                </dl>
            </div>
        </div>
        <a href="{% url 'changePassword_view' %}">Change password</a>
    </div>
  <h2>Change Password</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Change Password</button>
  </form>
{% endblock %}
