

{% extends 'base.html' %}
{% block content %}
<div class="container">
    <div class="row">
      <div class="col-md-6 offset-md-3">
        <div class="card">
            <div class="card-header">Confirm Delete</div>
            <div class="card-body">
        <p>Are you sure you want to this prescription?</p>
        <p>Patient : {{prescription.patient}}
        </p> 
        <form method="post">
          {% csrf_token %}
          <div class="row">
            <div class="col-md-6">
                <button type="submit" class="btn btn-danger">Delete</button>
                <a href="{% url 'prescription_list' %}" class="btn btn-secondary">Cancel</a>
            </div>
        </div>
        </form>
      </div>
      </div>
      </div>
      </div>
    </div>
  </div>
  
{% endblock %}
