{% extends 'base.html' %}
{% block content %}
<div class="container mt-5">
    <h1>Receipt</h1>
    <h2>Order {{ order.order_number }}</h2>
    <table class="table table-striped">
        <thead>
            <tr>
                <th>Item</th>
                <th>Quantity</th>
                <th>Price</th>
                <th>Total</th>
            </tr>
        </thead>
        <tbody>
            {% for item in order.items.all %}
            <tr>
                <td>{{ item.medication.name }}</td>
                <td>{{ item.quantity }}</td>
                <td>{{ item.price }}</td>
                <td>{{ item.price * item.quantity }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    <h3>Total: {{ total_price }}</h3>
</div>
{% endblock %}
